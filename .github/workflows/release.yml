name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-and-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to master
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/master

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Activate npm 12
        run: |
          corepack enable
          corepack prepare npm@12.0.2 --activate
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run ci

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
